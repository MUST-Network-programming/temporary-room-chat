<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f7"><title>同行 · 临时聊天室</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="同行聊天室首页">
    <span class="brand-mark" aria-hidden="true">同</span><span>同行</span>
  </a>
  <div class="topbar-actions">
    <span id="status" class="connection" role="status">正在连接…</span>
    <label class="sr-only" for="theme">外观主题</label>
    <select id="theme" class="theme-control">
      <option value="system">跟随系统</option>
      <option value="light">浅色</option>
      <option value="dark">深色</option>
    </select>
  </div>
</header>
<main>
<section id="lobby" class="entry lobby" hidden aria-labelledby="welcome">
  <div class="entry-heading">
    <div><h1 id="welcome">房间大厅</h1><p>创建一个临时房间，或用房间码加入。</p></div>
    <button id="logout" class="secondary" type="button" hidden>退出登录</button>
  </div>
  <p id="signed-in" class="muted" hidden></p>
  <form id="entry-form" class="entry-form">
    <div id="nickname-field" class="field">
      <label for="nickname">昵称</label>
      <input id="nickname" name="nickname" autocomplete="nickname" maxlength="48" placeholder="输入你的昵称">
    </div>
    <div class="field">
      <label for="room-code">房间码</label>
      <div class="join-row">
        <input id="room-code" name="room" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="6 位加入码">
        <button id="join" type="submit" disabled>加入房间</button>
      </div>
    </div>
    <div class="field" id="recent-field" hidden>
      <label for="recent">最近房间</label>
      <select id="recent"><option value="">选择最近房间</option></select>
    </div>
    <p id="notice" class="notice" role="status" hidden></p>
    <div class="lobby-create">
      <div><h2>创建房间</h2><p>把房间码发给想邀请的人。</p></div>
      <button id="create" class="secondary" type="button" disabled>创建房间</button>
    </div>
  </form>
</section>
<section id="room-view" class="room-view" hidden aria-labelledby="room-name">
  <header class="conversation-heading">
    <div class="conversation-title">
      <h1 id="room-name">同行房间</h1>
      <p><span id="member-count">0</span> 人在线 <span aria-hidden="true">·</span> <span id="identity"></span></p>
    </div>
    <div class="conversation-actions">
      <button id="room-info" class="secondary" type="button" aria-expanded="false" aria-controls="room-sidebar">房间信息</button>
      <button id="leave" class="secondary" type="button">离开房间</button>
    </div>
  </header>
  <aside id="room-sidebar" class="room-sidebar" aria-label="房间信息">
    <div class="members-block">
      <h2>在线成员</h2>
      <ul id="members"></ul>
    </div>
    <section id="room-recent" class="room-recent" hidden>
      <h2>最近房间</h2>
      <ul id="room-recent-list"></ul>
    </section>
    <div>
      <p class="small-label">房间码</p>
      <strong id="room-id" class="room-id"></strong>
    </div>
    <details id="room-settings" class="room-settings">
      <summary>房间设置</summary>
      <div class="room-settings-body">
        <button id="copy-code" class="text-button" type="button">复制房间码</button>
        <p id="expiry" class="muted"></p>
        <div class="room-actions">
          <button id="rename" class="secondary" type="button" hidden>更改群名</button>
          <button id="close-room" class="danger" type="button" hidden>关闭房间</button>
        </div>
      </div>
    </details>
  </aside>
  <div class="conversation">
    <div class="message-area">
      <div id="messages" role="log" aria-label="聊天记录" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
      <button id="latest" class="secondary" type="button" hidden>回到最新</button>
    </div>
    <p id="room-notice" class="room-notice" role="status" hidden></p>
    <form id="message-form" class="composer">
      <div class="composer-row">
        <button id="expression-toggle" class="secondary" type="button" aria-expanded="false" aria-controls="expression-options">表情</button>
        <label class="sr-only" for="message">消息内容</label>
        <textarea id="message" rows="1" maxlength="2048" placeholder="写点什么…" required></textarea>
        <button id="send" type="submit" disabled>发送</button>
      </div>
      <div id="expression-options" hidden>
        <p id="emoji-label" class="expression-label">插入表情</p>
        <div id="emoji-options" class="expression-grid" role="group" aria-labelledby="emoji-label"></div>
        <p id="sticker-label" class="expression-label">直接发送贴图</p>
        <div id="sticker-options" class="expression-grid" role="group" aria-labelledby="sticker-label"></div>
      </div>
    </form>
  </div>
</section>
<section id="account-panel" class="entry account-panel" hidden aria-labelledby="account-title">
  <div class="entry-heading">
    <div><h1 id="account-title">登录聊天室</h1><p id="account-description">使用你的同行账号继续。</p></div>
  </div>
  <form id="account-form" class="entry-form">
    <div class="field">
      <label for="account-name">用户名</label>
      <input id="account-name" autocomplete="username" required minlength="3" maxlength="24" pattern="[a-z0-9_]+" aria-describedby="account-name-hint" autocapitalize="none" spellcheck="false">
      <p id="account-name-hint" class="field-hint">3–24 位，仅限小写英文字母、数字和下划线（_）。</p>
    </div>
    <div class="field">
      <label for="account-password">密码</label>
      <input id="account-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" aria-describedby="account-password-hint">
      <p id="account-password-hint" class="field-hint">至少 8 个字符。</p>
    </div>
    <div id="invite-field" class="field" hidden>
      <label for="invite-code">一次性注册码</label>
      <input id="invite-code" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="invite-code-hint">
      <p id="invite-code-hint" class="field-hint">向活动组织者领取注册码。</p>
    </div>
    <p id="account-notice" class="notice" role="status" hidden></p>
    <button id="account-submit" type="submit" disabled>登录</button>
    <button id="account-toggle" class="secondary" type="button">注册账号</button>
  </form>
</section>
</main>
<footer><span id="transport"></span></footer>
</body>
</html>
